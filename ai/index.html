<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 진행 지침 · 오레마스</title>
<meta name="description" content="망켓몬 AI 배틀 진행 지침과 진행 기록 — 사람이 읽는 화면. AI 에게는 README.md 주소를 준다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 10-31 망령 「다른 AI 한테도 쉽게 명령하고 싶어서」: 지침 · 기록을 저장소 ai/ 에 두고, 이 화면은 사람이 읽는 판. AI 에게는 README.md 글 주소를 준다. */
:root{--bg:#0d0f14;--pp:#161a22;--pl:#262c38;--tx:#eef1f6;--mu:#8d96a8;--ac:#2fb36b;--wn:#ffd166;--rd:#e4002b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.75 'IBM Plex Sans KR',system-ui,sans-serif}
a{color:#7cc4ff}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 18px;background:rgba(13,15,20,.94);border-bottom:1px solid var(--pl);backdrop-filter:blur(6px)}
.top h1{margin:0;font-size:16px;font-weight:700;white-space:nowrap}
.top h1 small{font-weight:500;color:var(--mu);margin-left:6px;font-size:12px}
.tabs{display:flex;gap:4px;background:var(--pp);border-radius:999px;padding:3px}
.tabs a{padding:4px 14px;border-radius:999px;color:var(--mu);text-decoration:none;font-size:13px;font-weight:600}
.tabs a.on{background:var(--pl);color:var(--tx)}
.sp{flex:1}
.act{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--pl);background:var(--pp);color:var(--tx);border-radius:999px;padding:4px 12px;font:600 12.5px inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--pl)}
.btn.ac{background:var(--ac);border-color:var(--ac);color:#fff}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;padding:22px 18px 60px}
nav.toc{position:sticky;top:64px;align-self:start;max-height:calc(100dvh - 84px);overflow:auto;font-size:13px;line-height:1.45;padding-right:6px}
nav.toc b{display:block;color:var(--mu);font-size:11px;letter-spacing:.12em;margin-bottom:6px}
nav.toc a{display:block;color:var(--mu);text-decoration:none;padding:4px 8px;border-radius:8px}
nav.toc a.h3{padding-left:20px;font-size:12.5px}
nav.toc a:hover{background:var(--pp);color:var(--tx)}
input.q{width:100%;margin-bottom:10px;background:var(--pp);border:1px solid var(--pl);color:var(--tx);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px}
article{min-width:0;max-width:860px}
article h1{font-size:26px;margin:0 0 6px}
article h2{font-size:20px;margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--pl);scroll-margin-top:70px}
article h3{font-size:16.5px;margin:24px 0 8px;scroll-margin-top:70px}
article h4{font-size:15px;margin:18px 0 6px;color:#c7d0dd}
article p,article li{color:#dfe4ec}
article strong{color:#fff}
article code{font:13px 'IBM Plex Mono',monospace;background:var(--pp);border:1px solid var(--pl);border-radius:5px;padding:0 5px}
article pre{background:var(--pp);border:1px solid var(--pl);border-radius:10px;padding:12px 14px;overflow:auto;line-height:1.55}
article pre code{background:none;border:0;padding:0}
article blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--ac);background:rgba(47,179,107,.08);border-radius:0 8px 8px 0;color:#cfe9da}
article table{border-collapse:collapse;font-size:13.5px;margin:10px 0;display:block;overflow-x:auto;max-width:100%}
article th,article td{border:1px solid var(--pl);padding:6px 10px;vertical-align:top;text-align:left}
article th{background:var(--pp);white-space:nowrap}
article hr{border:0;border-top:1px dashed var(--pl);margin:26px 0}
article del{color:var(--mu)}
mark{background:rgba(255,209,102,.35);color:inherit;border-radius:3px}
.msg{color:var(--mu);padding:40px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:820px){.wrap{grid-template-columns:1fr}nav.toc{position:static;max-height:none;border-bottom:1px solid var(--pl);padding-bottom:10px}}
</style>
</head>
<body>
<header class="top">
 <h1>AI 진행 지침<small>망켓몬 · 오레마스</small></h1>
 <div class="tabs" role="tablist"><a href="#readme" data-d="readme">안내</a><a href="#guide" data-d="guide">배틀 진행 지침</a><a href="#log" data-d="log">진행 기록</a></div>
 <span class="sp"></span>
 <div class="act"><button class="btn ac" id="cp" title="다른 AI 에게 붙여 넣을 한 줄을 복사해요">AI 에게 줄 한 줄 복사</button><a class="btn" id="raw" target="_blank" rel="noopener">글 그대로 ↗</a><a class="btn" id="ed" target="_blank" rel="noopener">GitHub 에서 고치기 ↗</a></div>
</header>
<div class="wrap"><nav class="toc"><input class="q" id="q" type="search" placeholder="이 문서에서 찾기"><b>차례</b><div id="toc"></div></nav><article id="doc"><p class="msg">불러오는 중…</p></article></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
"use strict";
const DOCS={readme:'README.md',guide:'battle-guide.md',log:'battle-log.md'};
const BASE=new URL('./',location.href).href;
const EDIT='https://github.com/MangRyoung/oremas/edit/main/ai/';
const $=s=>document.querySelector(s);
const cache={};
function cur(){const h=location.hash.slice(1);return DOCS[h]?h:'readme'}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}
async function load(k){if(cache[k])return cache[k];const r=await fetch(BASE+DOCS[k],{cache:'no-cache'});if(!r.ok)throw new Error(r.status);return cache[k]=await r.text()}
async function show(){const k=cur();document.querySelectorAll('.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.d===k));
 $('#raw').href=BASE+DOCS[k];$('#ed').href=EDIT+DOCS[k];
 let md;try{md=await load(k)}catch(e){$('#doc').innerHTML=`<p class="msg">${DOCS[k]} 을(를) 읽지 못했어요 (${e.message}).</p>`;return}
 md=md.replace(/^<!--[\s\S]*?-->\s*/,'');
 /* 이 화면 안의 주소(…/ai/battle-guide.md)는 탭으로 */
 $('#doc').innerHTML=marked.parse(md).replace(/<a href="[^"]*\/ai\/(README|battle-guide|battle-log)\.md">(?!https?:)/g,(m,n)=>`<a href="#${{README:'readme','battle-guide':'guide','battle-log':'log'}[n]}">`);   /* 글자로 된 링크만 탭으로 (주소가 그대로 보이는 링크는 글 주소 그대로) */
 const H=[...document.querySelectorAll('#doc h2,#doc h3')];H.forEach((h,i)=>h.id='s'+i);
 $('#toc').innerHTML=H.map((h,i)=>`<a class="${h.tagName.toLowerCase()}" href="#${k}" data-to="s${i}">${h.textContent}</a>`).join('');
 $('#q').value='';document.title=($('#doc h1')||{}).textContent||'AI 진행 지침';scrollTo(0,0)}
$('#toc').addEventListener('click',e=>{const a=e.target.closest('[data-to]');if(!a)return;e.preventDefault();document.getElementById(a.dataset.to).scrollIntoView({behavior:'smooth'})});
/* 찾기: 맞는 글자에 표시하고 첫 자리로 */
let qT=0;$('#q').addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(()=>{const q=$('#q').value.trim();const d=$('#doc');d.querySelectorAll('mark').forEach(m=>m.replaceWith(m.textContent));d.normalize();if(!q)return;
 const w=document.createTreeWalker(d,NodeFilter.SHOW_TEXT);const hits=[];let n;while(n=w.nextNode())if(n.nodeValue.includes(q))hits.push(n);
 hits.forEach(t=>{const parts=t.nodeValue.split(q);const f=document.createDocumentFragment();parts.forEach((p,i)=>{if(i){const m=document.createElement('mark');m.textContent=q;f.appendChild(m)}f.appendChild(document.createTextNode(p))});t.replaceWith(f)});
 const first=d.querySelector('mark');if(first)first.scrollIntoView({block:'center'});else toast('없어요')},250)});
$('#cp').onclick=async()=>{const line=`${BASE}README.md 를 읽고, 거기 적힌 순서대로 지침을 읽은 다음 배틀을 진행해 줘.`;try{await navigator.clipboard.writeText(line);toast('복사했어요')}catch(e){prompt('복사해 주세요',line)}};
addEventListener('hashchange',show);show();
</script>
</body>
</html>
